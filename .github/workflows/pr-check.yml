name: PR Tekshiruv

# Har bir PR (main'ga qaratilgan) ochilganda/yangilanganda ishlaydi.
# Maqsad: merge qilishdan OLDIN xatolarni ushlash — PR'da yashil ✓ yoki qizil ✗ chiqadi.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Sintaksis va maxfiy kalit tekshiruvi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaksis va maxfiy kalit tekshiruvi
        run: node .github/validate.js

      # Mijoz tomoni qatlamining MANTIQ sinovi: index.html dan haqiqiy
      # skript bloki ajratib olinib bajariladi (nusxa emas). Eng xatoga
      # moyil qismlarni qo'riqlaydi: «mening mashinam» ni kategoriyaga
      # moslash, filtr/saralash va «ishlab chiqarilgan joy».
      - name: Mijoz tomoni qatlami sinovi
        run: node .github/test-customer-layer.js

      # Aksiya/filtr qatlami — PUL bilan ishlaydi (narxni o'zgartiradi),
      # shuning uchun yaxlitlash va «chegirma asl narxdan» qoidalari
      # alohida qo'riqlanadi.
      - name: Aksiya va filtr qatlami sinovi
        run: node .github/test-promo-layer.js

      # Mijoz darajasi va cashback — bu ham PUL bilan ishlaydi. Ilgari
      # ko'rsatilgan imtiyoz (cashbackX, discount) hech qachon berilmagan
      # edi; sinov shuning qaytalanmasligini qo'riqlaydi.
      - name: Daraja va cashback sinovi
        run: node .github/test-tier-cashback.js

      # Chidamli qidiruv — mijoz nomni xato yozsa tovar chiqmay qolsa,
      # savdo JIMGINA yo'qoladi. Sinov ham topilishini, ham BEGONA
      # natija chiqmasligini qo'riqlaydi.
      - name: Chidamli qidiruv sinovi
        run: node .github/test-smart-search.js

      # AI chat — mijoz bilan bevosita gaplashadigan joy. Sinov XSS
      # himoyasini, suhbatlar mantiqini va bot bilan shartnomani
      # (bot_status, faol suhbat, rasm) qo'riqlaydi.
      - name: AI chat sinovi
        run: node .github/test-ai-chat.js

      # 🔐 Xavfsiz ulanish (auth) QOTIB QOLMASLIGI. Haqiqiy nosozlik:
      # `/auth` so'rovida vaqt chegarasi yo'q edi — Worker javob bermasa
      # `_authReady` abadiy hal bo'lmay, `initUserData()` shu yerda kutib
      # qolardi va MIJOZGA HECH NARSA YUKLANMASDI. Sinov ana shu holatni
      # (javob bermaydigan `fetch`) taqlid qiladi.
      - name: Auth qotib qolmasligi sinovi
        run: node .github/test-auth-guard.js

      - name: Python sintaksisi (bot)
        run: |
          python3 -m py_compile bot/bot.py bot/ai_agent.py bot/fb_utils.py \
                                bot/bulk_import_fixed.py
          echo "✅ Python fayllari sintaktik toza"

      # AI agenti sinovlari — Groq va Firebase SOXTA, ya'ni tashqi
      # xizmat va maxfiy kalit KERAK EMAS.
      - name: AI agenti sinovlari
        working-directory: bot
        run: |
          python3 tests/test_ai_agent.py
          python3 tests/test_ai_write.py
          python3 tests/test_owner_mode.py
