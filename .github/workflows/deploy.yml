name: Deploy to GitHub Pages

# Har safar main'ga push bo'lganda avtomatik ishlaydi.
# Qo'lda ham ishga tushirish mumkin (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages uchun zarur ruxsatlar
permissions:
  contents: read
  pages: write
  id-token: write

# Bir vaqtda faqat bitta deploy borishini kafolatlash
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site (CI fayllari va bot papkalari chiqarib tashlanadi)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'bot' \
            --exclude 'album_3d/bot' \
            --exclude 'instagram_bot' \
            --exclude 'music_bot' \
            ./ _site/

      # ⚡ IXCHAMLASHTIRISH: _site/index.html dagi JS/CSS ixchamlanadi, katta
      # skriptlar assets/js/*.<hash>.js ga chiqariladi (repodagi asl fayl o'zgarmaydi).
      # Muammo bo'lsa o'chirish: Settings -> Secrets and variables -> Actions ->
      # Variables -> A1_SKIP_BUILD = 1 (keyingi deploy asl faylni chiqaradi).
      - name: Node.js o'rnatish
        if: ${{ vars.A1_SKIP_BUILD != '1' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ixchamlashtirish (build-site)
        if: ${{ vars.A1_SKIP_BUILD != '1' }}
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund terser@5.51.2
          node .github/build-site.js _site
          for f in _site/assets/js/*.js; do node --check "$f"; done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Avto A1 sayti (bot/CI fayllarisiz)
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
