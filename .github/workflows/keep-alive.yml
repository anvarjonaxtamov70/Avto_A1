name: Keep Alive (botlarni uyg'oq tutish)

# =====================================================================
#  NEGA BU FAYL O'ZGARTIRILDI? — 2026-08 dagi «bot ishlamayapti» sababi
#
#  Render bepul tarifda IKKI CHEKLOV bor:
#    1) 15 daqiqa so'rov bo'lmasa xizmat uxlaydi (spin down);
#    2) BUTUN WORKSPACE uchun oyiga 750 "instance hour" beriladi.
#       Kvota tugasa — bepul xizmatlar KEYINGI OYGA QADAR TO'XTATILADI
#       va /health doimiy 503 qaytaradi.
#
#  Ilgari bu workflow har 10 daqiqada, KUNIGA 24 SOAT ping yuborardi.
#  Bitta xizmatni 24/7 uyg'oq tutish = ~720 soat/oy. Zimmer + Avto_A1
#  ikkalasi birga = ~1440 soat/oy, kvota esa 750 — ya'ni kvota oyning
#  o'rtasida tugab, IKKALA BOT HAM o'chib qolardi. Aynan shu bo'ldi.
#
#  YECHIM: faqat ISH VAQTIDA uyg'oq tutamiz.
#    04:00–13:50 UTC = 09:00–18:50 Toshkent (do'kon ish vaqti)
#    Hisob: 2 xizmat x ~10 soat x 31 kun = ~620 soat < 750 ✅
#
#  Kechasi bot uxlaydi — mijoz yozganda 30–60 soniyada o'zi uyg'onadi.
#  24/7 uyg'oq bo'lishi SHART bo'lsa, yagona yo'l — pullik tarif
#  (xizmat uchun $7/oy) yoki faqat BITTA botni 24/7 qoldirish.
#
#  MANZILLARNI O'ZGARTIRISH: Settings -> Secrets and variables ->
#  Actions -> Variables -> New variable:
#     Name:  KEEP_ALIVE_URLS
#     Value: https://xxx.onrender.com https://yyy.onrender.com
# =====================================================================
on:
  schedule:
    # Faqat ish vaqti: 04:00–13:50 UTC (= 09:00–18:50 Toshkent), har 10 daqiqada.
    # DIQQAT: bu qatorni 24 soatga qaytarsangiz kvota yana tugaydi.
    - cron: '*/10 4-13 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: "Faqat bitta manzilni ping qilish (bo'sh qoldirsangiz — hammasi)"
        required: false
        default: ''

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Botlarga ping yuborish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping
        env:
          URLS_VAR: ${{ vars.KEEP_ALIVE_URLS }}
          URL_INPUT: ${{ github.event.inputs.url }}
        run: |
          set -u

          # ——— Standart ro'yxat ———
          # FAQAT haqiqatan Render'da mavjud xizmat. Ilgari bu ro'yxatda
          # music-bot / instagram-bot / album-bot / ivy-jewelry-bot ham bor
          # edi, lekin ularning hammasi 404 qaytaradi (Render'da bunday
          # xizmat yo'q). Natijada workflow ASOSIY bot sog'lom bo'lganda ham
          # doim qizil bo'lib turardi va haqiqiy nosozlik ko'rinmasdi.
          # Ularni deploy qilganingizda KEEP_ALIVE_URLS variable'iga qo'shing.
          DEFAULT_URLS="https://avto-a1-bot.onrender.com"

          if [ -n "${URL_INPUT// /}" ]; then
            URLS="$URL_INPUT"
            echo "Qo'lda kiritilgan manzil ishlatilyapti."
          elif [ -n "${URLS_VAR// /}" ]; then
            URLS="$URLS_VAR"
            echo "KEEP_ALIVE_URLS repo variable'i ishlatilyapti."
          else
            URLS="$DEFAULT_URLS"
            echo "Standart manzil ishlatilyapti."
          fi

          ok=0
          fail=0
          suspended=0
          missing=0

          for raw in $URLS; do
            base="${raw%/}"
            [ -z "$base" ] && continue
            url="$base/health"

            code=""
            # Uxlagan xizmat "sovuq start" uchun 60 soniyagacha vaqt oladi
            for attempt in 1 2 3; do
              code=$(curl -sS -o /dev/null -L \
                       -w '%{http_code}' \
                       --max-time 120 \
                       -H 'User-Agent: github-actions-keep-alive' \
                       "$url" 2>/dev/null || echo "000")
              case "$code" in
                2*|3*) break ;;
              esac
              echo "  urinish $attempt: $code — 15s dan keyin qayta..."
              sleep 15
            done

            case "$code" in
              2*|3*)
                echo "✅ $url -> $code (uyg'oq)"
                ok=$((ok + 1))
                ;;
              404)
                # Render'da bunday xizmat YO'Q — uyquga aloqasi yo'q
                echo "::warning title=Xizmat topilmadi::$url -> 404. Render'da bu nomdagi xizmat mavjud emas. Manzilni tekshiring yoki KEEP_ALIVE_URLS dan olib tashlang."
                missing=$((missing + 1))
                ;;
              503)
                # 3 marta urinishdan keyin ham 503 — bu UYQU EMAS.
                # Eng ehtimolli sabab: bepul kvota (750 soat/oy) tugagan yoki
                # oxirgi deploy yiqilgan.
                echo "::error title=Xizmat to'xtatilgan (503)::$url -> 503. Bu sovuq start EMAS (3 marta urinildi). Tekshiring: (1) Render -> Billing -> free instance hours tugaganmi? (2) Render -> xizmat -> Events: oxirgi deploy yiqilganmi? (3) Logs: bot ishga tushayotganda xato beryaptimi?"
                suspended=$((suspended + 1))
                ;;
              *)
                echo "::warning title=Ping muvaffaqiyatsiz::$url -> $code"
                fail=$((fail + 1))
                ;;
            esac
          done

          echo ""
          echo "Natija: $ok uyg'oq | $suspended to'xtatilgan(503) | $missing topilmadi(404) | $fail boshqa xato"

          # Faqat HAQIQIY muammoda qizil bo'ladi: bitta ham uyg'oq emas VA
          # sababi 404 (ya'ni shunchaki ro'yxatda keraksiz manzil) emas.
          if [ "$ok" -eq 0 ] && [ $((suspended + fail)) -gt 0 ]; then
            echo "::error title=Bot javob bermadi::Yuqoridagi izohlarni o'qing."
            exit 1
          fi
