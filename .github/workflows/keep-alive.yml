name: Keep Alive (botlarni uyg'oq tutish)

# =====================================================================
#  NEGA BU KERAK?
#  Render.com bepul "web service" 15 daqiqa KIRUVCHI so'rov bo'lmasa
#  uxlab qoladi (spin down) — konteyner butunlay to'xtaydi.
#  Bot ichidagi "self-ping" bu holatda YORDAM BERMAYDI, chunki bot
#  jarayonining o'zi ham o'chgan bo'ladi va ping yubora olmaydi.
#
#  Shu sababli TASHQARIDAN ping kerak. Bu workflow har 10 daqiqada
#  botlarning /health manziliga GET yuboradi — uxlagan bo'lsa uyg'otadi,
#  uyg'oq bo'lsa uyg'oq holda saqlaydi. Butunlay BEPUL.
#
#  QO'LDA UYG'OTISH: GitHub -> Actions -> "Keep Alive (botlarni uyg'oq
#  tutish)" -> "Run workflow" tugmasi. Xohlasangiz faqat bitta manzilni
#  ham kiritishingiz mumkin.
#
#  MANZILLARNI O'ZGARTIRISH: Settings -> Secrets and variables ->
#  Actions -> Variables -> New variable:
#     Name:  KEEP_ALIVE_URLS
#     Value: https://xxx.onrender.com https://yyy.onrender.com
#  (bo'sh joy yoki yangi qatordan ajratib yozing). Bu o'rnatilsa,
#  pastdagi standart ro'yxat o'rniga shu ishlatiladi.
# =====================================================================
on:
  schedule:
    # Har 10 daqiqada (GitHub cron'ni band paytlarda bir necha daqiqa
    # kechiktirishi mumkin — bu normal, 15 daqiqa limitiga yetadi).
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: "Faqat bitta manzilni ping qilish (bo'sh qoldirsangiz — hammasi)"
        required: false
        default: ''

# Bir vaqtda faqat bitta ping ishlasin (navbat yig'ilib ketmasligi uchun)
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Botlarga ping yuborish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping
        env:
          # Repo variable (KEEP_ALIVE_URLS) bo'lsa — o'sha ishlatiladi
          URLS_VAR: ${{ vars.KEEP_ALIVE_URLS }}
          URL_INPUT: ${{ github.event.inputs.url }}
        run: |
          set -u

          # ——— Standart ro'yxat (render.yaml'dagi xizmat nomlari asosida) ———
          DEFAULT_URLS="https://avto-a1-bot.onrender.com
          https://music-bot.onrender.com
          https://instagram-bot.onrender.com
          https://album-bot.onrender.com
          https://ivy-jewelry-bot.onrender.com"

          if [ -n "${URL_INPUT// /}" ]; then
            URLS="$URL_INPUT"
            echo "Qo'lda kiritilgan manzil ishlatilyapti."
          elif [ -n "${URLS_VAR// /}" ]; then
            URLS="$URLS_VAR"
            echo "KEEP_ALIVE_URLS repo variable'i ishlatilyapti."
          else
            URLS="$DEFAULT_URLS"
            echo "Standart manzillar ro'yxati ishlatilyapti."
          fi

          ok=0
          fail=0

          for raw in $URLS; do
            base="${raw%/}"
            [ -z "$base" ] && continue
            url="$base/health"

            code=""
            # Uxlagan xizmat "sovuq start" uchun 60 soniyagacha vaqt oladi,
            # shuning uchun uzun timeout + 3 marta urinish.
            for attempt in 1 2 3; do
              code=$(curl -sS -o /dev/null -L \
                       -w '%{http_code}' \
                       --max-time 120 \
                       -H 'User-Agent: github-actions-keep-alive' \
                       "$url" 2>/dev/null || echo "000")
              case "$code" in
                2*|3*) break ;;
              esac
              echo "  urinish $attempt: $code — 15s dan keyin qayta..."
              sleep 15
            done

            case "$code" in
              2*|3*)
                echo "✅ $url -> $code"
                ok=$((ok + 1))
                ;;
              *)
                echo "::warning title=Ping muvaffaqiyatsiz::$url -> $code (xizmat mavjud emasmi yoki manzil noto'g'ri?)"
                fail=$((fail + 1))
                ;;
            esac
          done

          echo ""
          echo "Natija: $ok ta uyg'oq, $fail ta javob bermadi."

          # Hech biri javob bermasa — workflow'ni qizil qilamiz (xabar kelishi uchun).
          if [ "$ok" -eq 0 ]; then
            echo "::error title=Hech bir bot javob bermadi::Manzillarni tekshiring (KEEP_ALIVE_URLS variable) yoki Render panelida xizmat holatini ko'ring."
            exit 1
          fi
