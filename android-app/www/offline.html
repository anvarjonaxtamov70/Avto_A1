<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avto A1 — Internet yo'q</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; text-align: center;
    background: radial-gradient(120% 60% at 50% 0%, rgba(201,168,76,.16), transparent 60%), #0a0a0b; color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", sans-serif; }
  .ic { width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; font: 800 30px/1 inherit; letter-spacing: -1px;
    background: linear-gradient(135deg, #f6dc7e, #d4af37 48%, #a07c1c); color: #1a1405; box-shadow: 0 14px 34px rgba(160,124,28,.38); }
  h1 { margin: 8px 0 0; font-size: 24px; letter-spacing: -.5px; }
  p { margin: 0; max-width: 300px; font-size: 15px; line-height: 1.45; color: rgba(235,235,245,.62); }
  button { margin-top: 10px; height: 52px; padding: 0 32px; border: 0; border-radius: 26px; font: 600 17px/1 inherit; color: #1a1405;
    background: linear-gradient(135deg, #f6dc7e, #d4af37 48%, #a07c1c); box-shadow: 0 8px 22px rgba(160,124,28,.34); }
  button:active { transform: scale(.96); }
</style>
</head>
<body>
  <div class="ic">A1</div>
  <h1>Internet yo'q</h1>
  <p>Avto A1 do'konini ochish uchun internetga ulaning va qayta urinib ko'ring.</p>
  <button type="button" onclick="retry()">Qayta urinish</button>
<script>
  var SITE = 'https://anvarjonaxtamov70.github.io/Avto_A1/';
  function retry() { location.href = SITE; }
  // Internet qaytishi bilan avtomatik qayta ochiladi
  window.addEventListener('online', retry);
</script>
</body>
</html>
